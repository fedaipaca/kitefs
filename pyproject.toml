[project]
name = "kitefs"
version = "0.1.0"
description = "A Python feature store library for offline/online feature storage, registry, validation, and serving"
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "Fedai Paca", email = "fedaipaca@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "click>=8.4.0",
    "pandas>=3.0.3",
    "pyarrow>=24.0.0",
    "pyyaml>=6.0.3",
]

[project.scripts]
kitefs = "kitefs.cli:cli"

[build-system]
requires = ["uv_build>=0.11.1,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.409",
    "pytest>=9.0.3",
    "pytest-bdd>=8.1.0",
    "ruff>=0.15.13",
]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src"]
indent-width = 4

[tool.ruff.format]
indent-style = "space"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["kitefs"]

[tool.pyright]
typeCheckingMode = "standard"
pythonVersion = "3.12"
include = ["src"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
bdd_features_base_dir = "tests/bdd/features"
